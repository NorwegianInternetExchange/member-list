<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Networks connected to NIX</title>
<style>
  :root {
    /* Matched to nix.no (uio1 theme + NIX local.css) */
    --fg: #2b2b2b;          /* body text */
    --muted: #808080;       /* secondary text */
    --line: #eaedee;        /* borders / rules */
    --head-bg: #eaedee;     /* table header background */
    --accent: #cd1719;      /* NIX brand red */
    --accent-dark: #9f121f; /* red, hover */
    --link: #2771bb;        /* content link blue */
    --row-hover: #f4f6f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 Arial, Helvetica, sans-serif;
    color: var(--fg);
    background: #fff;
    padding: 0 4px;
  }
  .meta { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
  .controls { margin: 12px 0; }
  .controls input {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 14px; width: 260px; max-width: 100%;
  }
  h2 {
    font-size: 18px; margin: 26px 0 6px; padding-bottom: 4px;
    border-bottom: 2px solid var(--accent);
  }
  h2 .count { font-size: 13px; color: var(--muted); font-weight: normal; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 8px; table-layout: fixed; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th {
    background: var(--head-bg); font-size: 12px; text-transform: uppercase;
    letter-spacing: .03em; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  tbody tr:hover { background: var(--row-hover); }
  td.asn, td.ip, td.speed { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.name { overflow-wrap: anywhere; }
  .speed-inline { display: none; color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* Column widths, so the fixed layout does not hand the IP columns more room
     than they need. */
  .c-asn { width: 8.5em; } .c-ip4 { width: 10em; } .c-ip6 { width: 15em; }
  .c-speed { width: 5em; }

  td.asn a { color: var(--link); text-decoration: none; }
  td.asn a:hover { text-decoration: underline; }
  .ip6 { color: var(--muted); }
  .manrs {
    display: inline-block; margin-left: 7px; padding: 0 5px;
    border: 1px solid var(--accent); border-radius: 3px;
    font-size: 11px; font-weight: bold; letter-spacing: .04em;
    color: var(--accent); text-decoration: none; white-space: nowrap;
  }
  .manrs:hover { background: var(--accent); color: #fff; }
  #legend .manrs { margin-left: 0; margin-right: 3px; }
  #status { padding: 14px; color: var(--muted); }
  #status.error { color: var(--accent-dark); }
  .hidden { display: none; }

  /* Narrow screens drop columns instead of stacking each row into a card. Cards
     would triple the page height, and the iframe on nix.no has a fixed height it
     cannot adapt (Vortex strips scripts from page content, so the usual
     postMessage auto-resize is not available). Keeping every network on one line
     at every width keeps the rendered height roughly viewport-independent, which
     is what lets one fixed height fit both a desktop and a phone. */
  @media (max-width: 880px) {
    .c-ip6 { display: none; }
    .c-asn { width: 7.5em; }
  }
  @media (max-width: 620px) {
    .c-ip4, .c-speed { display: none; }
    .speed-inline { display: inline; }
    th, td { padding: 7px 6px; }
    .c-asn { width: 6.5em; }
  }
</style>
</head>
<body>

<div id="status">Loading member list…</div>

<div class="meta hidden" id="meta"></div>
<div class="meta hidden" id="legend"></div>
<div class="controls hidden" id="controls">
  <input type="search" id="filter" placeholder="Filter by AS number or name…" autocomplete="off">
</div>

<div id="out"></div>

<script>
// One entry per IX-F export source. `only` restricts which exchanges are taken
// from that source (needed because NIX1 lives on both portals during migration,
// and ixp_id numbering differs between the two instances).
const EXPORTS = [
  { url: "https://portal.nix.no/api/v4/member-export/ixf/1.0",     only: ["NIX1", "TIX"] },
  { url: "https://portal-old.nix.no/api/v4/member-export/ixf/1.0", only: ["NIX2", "BIX", "SIX", "TRDIX"] }
];

// MANRS participants, mirrored into this repo daily by
// .github/workflows/update-manrs.yml. api.manrs.org sends no CORS header, so the
// browser cannot fetch it directly — it has to be served same-origin.
const MANRS_URL = "manrs.json";

const MANRS_BADGE =
  '<a class="manrs" href="https://www.manrs.org/" target="_blank" rel="noopener"' +
  ' title="This network is a MANRS participant">MANRS</a>';

// Display order of the exchange sections (unlisted ones are appended alphabetically).
const ORDER = ["NIX1", "NIX2", "BIX", "TRDIX", "SIX", "TIX"];

// Optional global filter (by shortname). Empty = show everything the sources yield.
const ONLY = []; // e.g. ["NIX1", "NIX2"]

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function speedLabel(mbps) {
  if (!mbps) return "";
  return mbps >= 1000 ? (mbps / 1000) + "G" : mbps + "M";
}

// The IX-F export timestamp is UTC. Show it in Norwegian time instead, with the
// CET/CEST label so it is unambiguous - and pinned to Europe/Oslo rather than
// the reader's own zone, so everyone sees the same figure NIX operations does.
function osloTime(ms) {
  try {
    const p = {};
    for (const part of new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Oslo",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false,
      timeZoneName: "short"
    }).formatToParts(new Date(ms))) p[part.type] = part.value;
    return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute} ${p.timeZoneName}`;
  } catch (e) {
    return new Date(ms).toISOString().replace("T", " ").replace(/:\d\d\..*/, " UTC");
  }
}

async function load() {
  let rowsByIx = {};   // shortname -> [rows]
  let newest = 0;
  let ok = 0;

  for (const src of EXPORTS) {
    try {
      const r = await fetch(src.url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      ok++;
      if (d.timestamp) newest = Math.max(newest, Date.parse(d.timestamp) || 0);

      const names = {}; // ixp_id -> shortname, scoped to THIS source
      for (const ix of (d.ixp_list || [])) names[ix.ixp_id] = ix.shortname;

      for (const m of (d.member_list || [])) {
        for (const c of (m.connection_list || [])) {
          const sn = names[c.ixp_id] || ("IXP " + c.ixp_id);
          if (src.only && !src.only.includes(sn)) continue;
          if (ONLY.length && !ONLY.includes(sn)) continue;
          if (c.state && c.state !== "active" && c.state !== "connected") continue;
          const speed = (c.if_list || []).reduce((a, i) => a + (i.if_speed || 0), 0);

          // One row per network per exchange; merge extra ports/IPs into it.
          const bucket = (rowsByIx[sn] = rowsByIx[sn] || {});
          const e = bucket[m.asnum] = bucket[m.asnum] ||
            { asnum: m.asnum, name: m.name || "", ipv4: [], ipv6: [], speed: 0 };
          e.speed += speed;
          for (const v of (c.vlan_list || [])) {
            const a4 = (v.ipv4 || {}).address, a6 = (v.ipv6 || {}).address;
            if (a4 && !e.ipv4.includes(a4)) e.ipv4.push(a4);
            if (a6 && !e.ipv6.includes(a6)) e.ipv6.push(a6);
          }
        }
      }
    } catch (e) {
      console.error("Failed to load", src.url, e);
    }
  }

  if (!ok) {
    const s = $("status");
    s.className = "error";
    s.textContent = "Could not load the member list right now. Please try again later.";
    return;
  }

  // Never let a MANRS hiccup take the member list down with it.
  let manrs = new Set();
  try {
    const r = await fetch(MANRS_URL, { cache: "no-store" });
    if (r.ok) manrs = new Set(((await r.json()).asns || []).map(Number));
  } catch (e) {
    console.error("Failed to load MANRS participant list", e);
  }

  $("status").classList.add("hidden");
  $("meta").classList.remove("hidden");
  $("controls").classList.remove("hidden");
  $("meta").textContent = "Source: NIX IX-F Member Export" +
    (newest ? " · updated " + osloTime(newest) : "");

  if (manrs.size) {
    const all = new Set();
    for (const bucket of Object.values(rowsByIx)) {
      for (const asnum of Object.keys(bucket)) all.add(Number(asnum));
    }
    const participants = [...all].filter(a => manrs.has(a)).length;
    $("legend").classList.remove("hidden");
    $("legend").innerHTML =
      MANRS_BADGE + " marks the " + participants + " of " + all.size +
      ' networks that participate in <a href="https://www.manrs.org/" target="_blank"' +
      ' rel="noopener">MANRS</a>, a commitment to routing security.';
  }

  render(rowsByIx, manrs);
  $("filter").addEventListener("input", () => applyFilter($("filter").value.trim().toLowerCase()));
}

function render(rowsByIx, manrs) {
  const out = $("out");
  out.innerHTML = "";
  const names = Object.keys(rowsByIx).sort((a, b) => {
    const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  for (const sn of names) {
    const rows = Object.values(rowsByIx[sn]).sort((a, b) => a.asnum - b.asnum);
    const sec = document.createElement("section");
    sec.dataset.ix = sn;
    sec.innerHTML =
      '<h2>' + esc(sn) + ' <span class="count">(' + rows.length + ' networks)</span></h2>' +
      '<table><thead><tr>' +
        '<th class="c-asn" data-k="asnum">AS</th><th data-k="name">Name</th>' +
        '<th class="c-ip4" data-k="ipv4">IPv4</th><th class="c-ip6" data-k="ipv6">IPv6</th>' +
        '<th class="c-speed" data-k="speed">Speed</th>' +
      '</tr></thead><tbody>' +
      rows.map(r =>
        '<tr data-s="' + esc((r.asnum + " " + r.name).toLowerCase()) + '">' +
          '<td class="asn c-asn"><a href="https://www.peeringdb.com/asn/' + encodeURIComponent(r.asnum) +
            '" target="_blank" rel="noopener">AS' + esc(r.asnum) + '</a></td>' +
          '<td class="name">' + esc(r.name) + (manrs.has(Number(r.asnum)) ? MANRS_BADGE : "") +
            // Shown only where the Speed column is hidden, so a phone still gets
            // the port speed without costing an extra line.
            (r.speed ? ' <span class="speed-inline">' + esc(speedLabel(r.speed)) + '</span>' : "") +
          '</td>' +
          '<td class="ip c-ip4">' + r.ipv4.map(esc).join("<br>") + '</td>' +
          '<td class="ip ip6 c-ip6">' + r.ipv6.map(esc).join("<br>") + '</td>' +
          '<td class="speed c-speed">' + esc(speedLabel(r.speed)) + '</td>' +
        '</tr>'
      ).join("") +
      '</tbody></table>';
    out.appendChild(sec);
  }
}

function applyFilter(q) {
  document.querySelectorAll("#out section").forEach(sec => {
    let shown = 0;
    sec.querySelectorAll("tbody tr").forEach(tr => {
      const hit = !q || tr.dataset.s.includes(q);
      tr.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    sec.classList.toggle("hidden", shown === 0);
  });
}

load();
</script>
</body>
</html>
