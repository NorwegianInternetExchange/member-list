name: Update MANRS participant list

# api.manrs.org serves no Access-Control-Allow-Origin header, so the page cannot
# fetch it from the browser. Mirror the ASN list into the repo instead and serve
# it same-origin from GitHub Pages.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MANRS ASN list
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -H 'Accept: application/json' \
            https://api.manrs.org/asns -o /tmp/manrs-raw.json

      - name: Rewrite manrs.json if the list changed
        run: |
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone

          asns = sorted({int(a) for a in json.load(open("/tmp/manrs-raw.json"))["asns"]})

          # Guard against an upstream hiccup wiping the badges off the page.
          if len(asns) < 100:
              sys.exit(f"refusing to write a suspiciously short list ({len(asns)} ASNs)")

          old = []
          if os.path.exists("manrs.json"):
              try:
                  old = json.load(open("manrs.json"))["asns"]
              except Exception:
                  pass

          if old == asns:
              print(f"unchanged ({len(asns)} ASNs)")
              sys.exit(0)

          with open("manrs.json", "w") as f:
              json.dump({
                  "generated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "source": "https://api.manrs.org/asns",
                  "asns": asns,
              }, f, indent=1)
              f.write("\n")

          print(f"{len(old)} -> {len(asns)} ASNs")
          PY

      - name: Commit
        run: |
          if git diff --quiet -- manrs.json; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manrs.json
          git commit -m "Update MANRS participant list"
          git push
